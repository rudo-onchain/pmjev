[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmjev"
version = "0.1.0"
description = "Paper-trading research for Polymarket crypto five-minute markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "langchain-typesafe>=0.0.1a3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["pmjev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pmjev"]
